<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yo‘lResurs.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Official institutional look: navy utility bar + white masthead, serif headings, restrained flag-green accent; tables and ruled lists over cards */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eef2f6; --ink:#0f1c2d; --muted:#556476; --line:#d7dee7;
  --brand:#0b3a6e; --brand-2:#0d5aa7; --link:#0d5aa7; --accent:#0e8a5c; --on-brand:#ffffff; --topbar:#072a51;
  --warn:#9a6200; --warn-bg:#fff5df; --bad:#b42318; --bad-bg:#fdecea; --ok:#0e7a52; --ok-bg:#e3f5ec;
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#0a111c; --surface:#111a28; --surface2:#172234; --ink:#e4eaf2; --muted:#93a1b4; --line:#243246;
  --brand:#0c2e55; --brand-2:#3d86d6; --link:#7fb2ec; --accent:#3fc28c; --on-brand:#ffffff; --topbar:#060c16;
  --warn:#f0b452; --warn-bg:#2b2213; --bad:#ff8f84; --bad-bg:#341a19; --ok:#5fd3a2; --ok-bg:#12291f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);transition:background .2s,color .2s}
a{color:var(--link)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1,h2{font-family:var(--display);font-weight:700}
h3{font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.sr{position:absolute;left:-9999px}

/* utility bar */
.topbar{background:var(--topbar);color:#c9d6e6;font-size:13.5px}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:40px;flex-wrap:wrap}
.topbar .tools{display:flex;align-items:center;gap:6px}
.tb-btn{background:none;border:1px solid rgba(255,255,255,.22);color:#e8eef6;border-radius:6px;padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.tb-btn:hover{background:rgba(255,255,255,.08)}
.langs{display:flex;gap:2px}
.langs button{background:none;border:0;color:#c9d6e6;padding:4px 8px;border-radius:5px;cursor:pointer;font-weight:700;font-size:13px}
.langs button.on{background:rgba(255,255,255,.16);color:#fff}
.admin-pill{background:var(--accent);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}

/* masthead */
.mast{background:var(--surface);border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:28px;min-height:84px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;color:var(--ink);text-decoration:none}
.emblem{width:50px;height:50px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.brand b{display:block;font:700 22px/1.1 var(--display);letter-spacing:.2px}
.brand small{display:block;font-size:13px;color:var(--muted);margin-top:3px;max-width:34ch;line-height:1.3}
nav.main{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav.main a{color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;padding:10px 10px;border-radius:6px;white-space:nowrap;position:relative}
nav.main a:hover{background:var(--surface2)}
nav.main a.on{color:var(--brand-2)}
nav.main a.on::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:3px;background:var(--brand-2);border-radius:2px}
:root[data-mode="dark"] nav.main a.on{color:var(--link)}
:root[data-mode="dark"] nav.main a.on::after{background:var(--link)}
.flagline{height:4px;background:linear-gradient(90deg,var(--brand-2) 0 33.3%,var(--surface) 33.3% 66.6%,var(--accent) 66.6%)}

.announce{background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--line);font-size:14.5px}
.announce .wrap{padding-top:9px;padding-bottom:9px;display:flex;gap:10px;align-items:baseline}
.announce b{white-space:nowrap}

main.wrap{padding-top:32px;padding-bottom:80px}
.view{display:none}
.view.on{display:block}

/* hero */
.hero{background:var(--brand);color:var(--on-brand);border-radius:12px;padding:44px 48px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:46%;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px);pointer-events:none}
.hero>*{position:relative;z-index:1;max-width:760px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.82}
.hero h1{font-size:clamp(26px,3.2vw,38px);margin:10px 0 12px}
.hero p{margin:0;opacity:.9;max-width:62ch}
.bigsearch{display:flex;gap:0;margin-top:26px;background:var(--surface);border-radius:8px;overflow:hidden;max-width:720px;border:2px solid transparent}
.bigsearch:focus-within{border-color:#f2b705}
.bigsearch input{flex:1;min-width:0;border:0;padding:14px 16px;outline:none;background:none;color:var(--ink);font-size:16.5px}
.bigsearch button{border:0;background:var(--accent);color:#fff;font-weight:700;padding:0 24px;cursor:pointer;display:flex;align-items:center;gap:8px}
.quick{margin-top:14px;font-size:14px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;opacity:.95}
.quick button{background:none;border:0;color:#fff;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;font-size:14px}
.quick span{opacity:.75}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:20px}
.kpi{padding:18px 22px;border:0;border-left:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:background .15s}
.kpi:hover{background:var(--surface-2,#f3f6fb)}.kpi:hover b{color:var(--accent,#0b5d3b)}.kpi:focus-visible{outline:2px solid var(--accent,#0b5d3b);outline-offset:-2px}
.kpis .kpi:first-child{border-radius:12px 0 0 12px}.kpis .kpi:last-child{border-radius:0 12px 12px 0}
.kpi:first-child{border-left:0}
.kpi b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:14px}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:44px 0 16px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.sec-h h2{font-size:23px}
.sec-h a{font-weight:600;text-decoration:none}

.home-grid{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:start}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.cat{border:0;background:none;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 18px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:flex-start;color:var(--ink)}
.cat:hover{background:var(--surface2)}
.cat .ci{color:var(--brand-2);flex:none;margin-top:2px}
:root[data-mode="dark"] .cat .ci{color:var(--link)}
.cat b{display:block;font-size:15.5px;line-height:1.3}
.cat span{font-size:13.5px;color:var(--muted)}

/* rows */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:16px;padding:16px 20px;border-top:1px solid var(--line);align-items:start;cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--ink)}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row:hover h3{color:var(--link);text-decoration:underline}
.ft{width:46px;height:56px;border:1.5px solid var(--line);border-radius:4px;display:grid;place-items:end center;padding-bottom:7px;font-size:11px;font-weight:700;color:var(--brand-2);background:var(--surface);position:relative}
.ft::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--brand-2);border-radius:3px 3px 0 0}
.ft.DOCX::before{background:#2f6fd6}.ft.DOCX{color:#2f6fd6}
.ft.DWG::before{background:#b45309}.ft.DWG{color:#b45309}
.ft.JPG::before{background:var(--accent)}.ft.JPG{color:var(--accent)}
.ft.PDF::before{background:#c0392b}.ft.PDF{color:#c0392b}
:root[data-mode="dark"] .ft.PDF{color:#ff8a7a}
.row h3{font-size:17px;line-height:1.35;font-weight:600}
.meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:4px;background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.tag.sample{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.link{color:var(--link)}
.nums{text-align:right;color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.5}
.nums b{color:var(--ink);font-size:14.5px}
mark{background:#ffe49a;color:#111;border-radius:2px;padding:0 1px}

.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.box h3{font-family:var(--display);font-size:19px;margin-bottom:12px}
.linklist{list-style:none;margin:0;padding:0}
.linklist li{border-top:1px solid var(--line);padding:11px 0}
.linklist li:first-child{border-top:0;padding-top:0}
.linklist a{font-weight:600;text-decoration:none;display:flex;justify-content:space-between;gap:10px}
.linklist a:hover{text-decoration:underline}
.linklist small{display:block;color:var(--muted);font-size:13px}
.about p{margin:0 0 10px;color:var(--muted);font-size:15px}
.ad{border:1px dashed var(--line);border-radius:10px;padding:16px;font-size:14px;color:var(--muted);background:var(--surface)}
.ad b{display:block;color:var(--ink);margin:4px 0 2px}
.ad .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* buttons, forms */
.btn{border:1px solid transparent;border-radius:7px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--brand-2);color:#fff;display:inline-flex;gap:8px;align-items:center;text-decoration:none;font-size:15px}
.btn:hover{filter:brightness(1.07);text-decoration:none}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:var(--surface2)}
.btn.green{background:var(--accent)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--line)}
.btn.danger.arm{background:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:14px;font-weight:700}
.field .hint{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-2) 18%,transparent)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .full{grid-column:1/-1}
.form3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks{display:flex;flex-direction:column;gap:6px;font-size:15px}
.checks label{display:flex;gap:9px;align-items:center;font-weight:400;cursor:pointer}
.checks input{accent-color:var(--brand-2);width:16px;height:16px}
.checks small{margin-left:auto;color:var(--muted)}
.err{color:var(--bad);font-size:14px;font-weight:600}
.okmsg{color:var(--ok);font-size:14px;font-weight:600}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface2)}
.drop:hover,.drop.over{border-color:var(--brand-2)}
.drop b{color:var(--ink)}

/* catalog */
.page-h{margin:4px 0 22px}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:8px}
.crumbs a{color:var(--muted)}
.page-h h1{font-size:clamp(26px,3vw,34px)}
.page-h p{color:var(--muted);margin:8px 0 0;max-width:70ch}
.cat-layout{display:grid;grid-template-columns:270px 1fr;gap:28px;align-items:start}
.rail{display:flex;flex-direction:column;gap:18px}
.fbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:18px}
.fbox h3{font-size:16px}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.searchrow{display:flex;gap:8px;margin-bottom:14px}
.searchrow input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:7px;background:var(--surface);outline:none}
.searchrow input:focus{border-color:var(--brand-2)}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* doc */
.doc-layout{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start}
.doc-main{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:30px}
.doc-main h1{font-size:clamp(23px,2.6vw,30px);margin:8px 0 10px}
.doc-main .authors{font-size:16px}
.doc-main h2{font-size:18px;margin:28px 0 10px;font-family:var(--body);font-weight:700}
table.props{width:100%;border-collapse:collapse;font-size:15px;margin-top:20px}
table.props th,table.props td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
table.props th{width:200px;color:var(--muted);font-weight:600;background:var(--surface2)}
table.props td{font-variant-numeric:tabular-nums;word-break:break-word}
.abs{max-width:70ch;margin:0}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw button{border:1px solid var(--line);background:var(--surface2);border-radius:5px;padding:4px 11px;font-size:14px;cursor:pointer}
.kw button:hover{border-color:var(--brand-2);color:var(--link)}
.cite{font-size:14.5px;background:var(--surface2);border-left:3px solid var(--brand-2);padding:12px 14px;border-radius:0 6px 6px 0;word-break:break-word}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.side{display:flex;flex-direction:column;gap:20px}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#qr{background:#fff;padding:10px;border:1px solid var(--line);border-radius:6px}
#qr img,#qr canvas{display:block}
.ident{font:600 14px ui-monospace,Menlo,monospace;background:var(--surface2);padding:4px 10px;border-radius:5px}
.note{font-size:13.5px;color:var(--muted)}
.rec-item{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;cursor:pointer;color:var(--ink)}
.rec-item:first-of-type{border-top:0;padding-top:0}
.rec-item b{display:block;font-size:14.5px;line-height:1.35;font-weight:600}
.rec-item:hover b{color:var(--link);text-decoration:underline}
.rec-item span{font-size:13px;color:var(--muted)}

/* admin */
.adm{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
.adm-nav{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:16px}
.adm-nav button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:7px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--ink)}
.adm-nav button:hover{background:var(--surface2)}
.adm-nav button.on{background:var(--brand-2);color:#fff}
.cnt{font-size:12px;font-weight:700;background:var(--surface2);color:var(--ink);border-radius:99px;padding:1px 8px}
.adm-nav button.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.cnt.hot{background:var(--warn-bg);color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.panel-h h2{font-size:22px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:720px}
table.tbl th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface2);padding:10px 12px;font-weight:700}
table.tbl td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top}
table.tbl td.t{font-weight:600;max-width:420px}
table.tbl td.act{white-space:nowrap;text-align:right}
table.tbl td.act .btn{margin-left:4px}
.status{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.st-pending{background:var(--warn-bg);color:var(--warn)}
.st-approved{background:var(--ok-bg);color:var(--ok)}
.st-rejected{background:var(--bad-bg);color:var(--bad)}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kcard{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surface)}
.kcard b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kcard span{font-size:14px;color:var(--muted)}
.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.switch input{width:42px;height:24px;appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:21px}
.gate{max-width:560px;margin:40px auto;text-align:center}
.gate h1{font-size:26px;margin:14px 0 8px}
.gate p{color:var(--muted)}
.editor{border:1px solid var(--brand-2);border-radius:10px;padding:22px;margin-bottom:22px;background:color-mix(in srgb,var(--brand-2) 4%,var(--surface))}
.editor h3{font-family:var(--display);font-size:19px;margin-bottom:16px}
.filechip{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}

.intl-orgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.org{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;cursor:pointer;color:var(--ink)}
.org:hover{border-color:var(--brand-2)}
.org b{display:block;font-size:15px}
.org span{font-size:13px;color:var(--muted)}
.org.on{border-color:var(--brand-2);box-shadow:inset 0 0 0 1px var(--brand-2)}
.tag.intl{background:color-mix(in srgb,var(--brand-2) 12%,transparent);color:var(--link);border-color:transparent}
.trbox{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 16px;background:var(--surface2);margin-top:14px}
.trbox .lbl{font-size:12.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.trbox h3{font-size:17px;margin:6px 0 6px;line-height:1.35}
.trbox p{margin:0}
.ft.WEB::before{background:#5b6b80}.ft.WEB{color:#5b6b80}
.sub-t{color:var(--muted);font-size:14.5px;margin-top:2px;font-style:italic}
.reader{margin-top:26px;padding-top:22px;border-top:2px solid var(--ink)}
.reader h2{font-family:var(--display);font-size:21px;margin:0 0 6px}
.rd-steps{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.rd-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 12px;padding:12px;background:var(--surface2);border-radius:8px;position:sticky;top:8px;z-index:2}
.rd-bar input{width:70px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

function wireEditor(){
  $("docForm").onsubmit=saveDoc;
  const dz=$("eDrop"), fi=$("eFile"); if(!dz)return;
  dz.onclick=()=>fi.click(); dz.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fi.click()}};
  dz.ondragover=e=>{e.preventDefault();dz.classList.add("over")}; dz.ondragleave=()=>dz.classList.remove("over");
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove("over");if(e.dataTransfer.files[0])uploadFile(e.dataTransfer.files[0])};

async function uploadFile(f){
  collectEditor(); $("eUp").textContent=t("uploading")+" "+f.name; $("eSave").disabled=true;
  try{
    if(f.size>20*1024*1024)throw new Error("20 MB");
    const r=await ASSETS.upload(f);
    const ext=(f.name.split(".").pop()||"").toLowerCase();
    editing.fileId=r.id; editing.fileUrl=r.url||("/_blob/"+r.id); editing.fileName=f.name; editing.fileSize=r.sizeBytes||f.size;
    editing.ftype=ext==="pdf"?"PDF":["jpg","jpeg","png"].includes(ext)?"JPG":editing.ftype;
    renderAdmin();
  }catch(err){$("eUp").textContent=t("up_fail")+": "+((err&&err.message)||"");$("eSave").disabled=false}
}
async function saveDoc(e){
  e.preventDefault(); collectEditor(); const er=$("eErr"); er.textContent="";
  if(!editing.title||!editing.authors.length){er.textContent=t("e_req").split(",")[0]+".";return}
  if(editing.link&&!okUrl(editing.link)){er.textContent=t("bad_url");return}
  if(!DB){er.textContent=t("db_off");return}
  const id=editing._id||newId("d"), now=Date.now();
  const rec={title:editing.title,authors:editing.authors,org:editing.org,cat:editing.cat,year:editing.year,lang:editing.lang,ftype:editing.ftype,pages:editing.pages,kw:editing.kw,abs:editing.abs,link:editing.link||"",intl:!!editing.intl,tr:editing.tr||{},
    fileId:editing.fileId||"",fileUrl:editing.fileUrl||"",fileName:editing.fileName||"",fileSize:editing.fileSize||0,
    ident:editing.ident||("YR-"+String(now).slice(-6)),createdAt:editing.createdAt||now,updatedAt:now};
  $("eSave").disabled=true;
  try{await DB.collection("docs").doc(id).set(rec);editing=null;admQuery="";toast(t("saved"));renderAdmin();window.scrollTo(0,0)}
  catch(err){er.textContent=(err&&err.code==="invalid_argument")?t("no_write"):((err&&err.message)||"Error");$("eSave").disabled=false}
}

async function saveLink(e){

async function moveLink(id,dir){
  const ls=[...links].sort((a,b)=>(a.order||0)-(b.order||0)); const i=ls.findIndex(l=>l._id===id), j=i+dir; if(i<0||j<0||j>=ls.length)return;
  const a=ls[i],b=ls[j]; const oa=a.order||i, ob=b.order||j;
  try{await DB.collection("links").doc(a._id).update({order:ob===oa?ob+dir:ob});await DB.collection("links").doc(b._id).update({order:oa})}catch(err){toast((err&&err.message)||"Error")}
}
async function saveSettings(patch,msg){
  if(!DB){toast(t("db_off"));return}

}

function qaFmt(text,ids){
  const lines=esc(text).split(/\n/); let h="", inUl=false;
  for(let ln of lines){ln=ln.trim();
    if(/^[-•*]\s+/.test(ln)){if(!inUl){h+="<ul>";inUl=true}h+="<li>"+ln.replace(/^[-•*]\s+/,"")+"</li>";continue}
    if(inUl){h+="</ul>";inUl=false}
    if(ln)h+="<p>"+ln+"</p>"}
  if(inUl)h+="</ul>";
  h=h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  if(ids)h=h.replace(/\[([A-Za-z0-9_\-., ]{2,80})\]/g,(m,inner)=>inner.split(/\s*[,;]\s*/).map(id=>ids.has(id)?`<a class="cite" href="#doc-${esc(id)}">${esc(id)}</a>`:esc("["+id+"]")).join(" "));
  return h;

let GL={src:{},terms:[]};
const glCap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;const glTerm=e=>glCap(lang==="uz"?uzLat(e.uz):e.uz);
const glDef=d=>d.l==="uz"&&lang==="uz"?uzLat(d.x):d.x;
const glNorm=e=>norm(e.uz+" "+uzLat(e.uz)+" "+e.ru+" "+e.en);
function glSrcHtml(sid){const s=GL.src[sid];if(!s)return"";const nm=norms.find(n=>n._id===s.nm);
  return `<div class="gl-src">${t("gl_src")}: <b>${esc(s.t)}</b>, ${esc(s.p)} · <a href="${esc(s.u)}" target="_blank" rel="noopener noreferrer">lex.uz ${EXT}</a>${nm?` · <a href="#norms" data-nmq="${esc(nm.number)}">${t("gl_reg")}</a>`:""}${nm&&nm.pdf?` · <a href="${esc(nm.pdf)}" target="_blank" rel="noopener noreferrer">⬇ ${t("nm_pdf")}</a>`:""}</div>`}
function glCard(e,q){const mk=x=>q?qaMark(x,q):esc(x);
  return `<article class="gl-item" id="gl-${e.id}"><h3>${mk(glTerm(e))}</h3>
    <div class="gl-eq"><span><i>RU</i> ${mk(e.ru)}</span><span><i>EN</i> ${mk(e.en)}</span>${lang!=="uz"&&/[ўқғҳ]/i.test(e.uz)?`<span><i>UZ</i> ${mk(uzLat(e.uz))}</span>`:""}</div>
    ${e.d.map(d=>`<div class="gl-def"><p>${mk(glDef(d))}${d.l==="ru"&&lang==="uz"?` <span class="note">(${t("gl_ru_orig")})</span>`:""}</p>${glSrcHtml(d.s)}</div>`).join("")}</article>`}
function renderGlossary(){
  const ar=$("glArea");
  if(ar.dataset.lang!==lang||ar.dataset.n!=String(GL.terms.length)){const v=ar.value;ar.innerHTML=`<option value="">${t("nm_all_areas")}</option>`+NM_AREAS.filter(a=>GL.terms.some(e=>e.a===a)).map(a=>`<option value="${a}">${esc(t("ar_"+a))} (${GL.terms.filter(e=>e.a===a).length})</option>`).join("");ar.value=v;ar.dataset.lang=lang;ar.dataset.n=GL.terms.length}
  $("glQ").placeholder=t("gl_search");
  const q=norm($("glQ").value.trim()), a=ar.value, L=$("glLetter").dataset.v||"";
  let r=GL.terms.filter(e=>(!a||e.a===a)&&(!q||glNorm(e).includes(q)||e.d.some(d=>norm(d.x+" "+uzLat(d.x)).includes(q))));
  const first=e=>{const s=glTerm(e).replace(/^[«"(]/,"");return s.charAt(0).toUpperCase()};
  const letters=[...new Set(r.map(first))].sort((x,y)=>x.localeCompare(y,lang));
  $("glLetter").innerHTML=`<button type="button" class="${L?"":"on"}" data-gll="">${t("gl_all")}</button>`+letters.map(c=>`<button type="button" class="${L===c?"on":""}" data-gll="${esc(c)}">${esc(c)}</button>`).join("");
  if(L)r=r.filter(e=>first(e)===L);
  r.sort((x,y)=>glTerm(x).localeCompare(glTerm(y),lang));
  $("glCount").textContent=`${r.length} ${t("gl_found")}`;
  const qt=q?[q]:null;
  $("glList").innerHTML=r.length?r.map(e=>glCard(e,qt)).join(""):`<div class="empty">${t("none")}</div>`;
}
function glSearch(terms){if(!GL.terms.length)return[];
  return GL.terms.map(e=>Object.assign({e},qaScore([[glNorm(e),5],[norm(e.d.map(d=>d.x+" "+uzLat(d.x)).join(" ")),1]],terms))).filter(x=>x.sc>=5).sort((a,b)=>b.sc-a.sc||glTerm(a.e).length-glTerm(b.e).length).slice(0,3)}

    {const mine=LS.get("yr_myspec",null);if(mine&&mine.id){myReq=mapExpert(mine.id,mine.rec||{});watchMySpec()}}

    db.collection("norms").onSnapshot(s=>{ok();norms=s.docs.map(d=>mapNorm(d.id,d.data()||{})).filter(n=>n.title);rerender()},()=>{});

  }catch(e){dbState="off";route()}
})();
